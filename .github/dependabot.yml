version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    ignore:
      # jqwik 1.10 is built against JUnit Platform 1.14, so JUnit stays on 5.x
      - dependency-name: org.junit:junit-bom
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The build stage's JDK must be the release build's (21): the release workflow checks that the jar built here
      # is byte for byte the released one. A new Java major is a decision of its own, for every build at once
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
